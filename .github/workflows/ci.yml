name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    env:
      # Pinned, not whatever apt happens to ship. The distribution package moves
      # between runner images, and shellcheck releases rename findings between
      # versions (SC2329 was SC2317), so an unpinned linter fails a branch that
      # was clean when it was written, for a reason that is not in the diff.
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version
      - name: Lint
        # The same script a working session runs, so a green lint here and a
        # green lint there mean the same thing.
        run: sh tests/lint.sh

  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fake-backed suite
        run: sh tests/run.sh
