name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -s sh -S style
          shellcheck -s sh -S style bin/macon libexec/* install.sh 2>/dev/null || true

  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fake-backed suite
        run: sh tests/run.sh
