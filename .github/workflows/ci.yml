name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        # The executables in libexec/ and bin/ carry no extension, so the find
        # below cannot reach them. They are named explicitly, in the same
        # invocation rather than a separate one: a file passed as input is a
        # file shellcheck will follow a `source=` directive into, which is how
        # the tests that source them stay free of SC1091.
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -s sh -S style libexec/macon-helper
          shellcheck -s sh -S style bin/macon install.sh 2>/dev/null || true

  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fake-backed suite
        run: sh tests/run.sh
